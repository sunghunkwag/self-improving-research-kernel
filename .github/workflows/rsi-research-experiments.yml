name: RSI Research Experiments

# Push trigger is intentionally limited to this workflow file so a green
# recovery run can be produced when manual dispatch is unavailable.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rsi-research-experiments.yml
  repository_dispatch:
    types:
      - rsi-research-experiment-recovery
  workflow_dispatch:
    inputs:
      max_generations:
        description: Maximum loop generations per experiment run.
        required: true
        default: "4"
      max_candidates:
        description: Maximum candidates per generation.
        required: true
        default: "4"
      wall_seconds:
        description: Wall-clock budget per loop run in seconds.
        required: true
        default: "1800"
      timeout_seconds:
        description: Per-command timeout in seconds.
        required: true
        default: "420"
      repeats:
        description: Repeated trials per repository/task/variant.
        required: true
        default: "2"
      repository:
        description: Repository fixture to run, or all.
        required: true
        default: "all"
      task:
        description: Experiment task to run, or all.
        required: true
        default: "all"
      variant:
        description: Experiment variant to run, or all.
        required: true
        default: "all"

permissions:
  contents: write
  actions: read

concurrency:
  group: rsi-research-experiments-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  experiments:
    name: Baselines, ablations, metrics, failure analysis, and safety report
    runs-on: ubuntu-latest
    timeout-minutes: 130

    env:
      OMEGA_THDSE_ENABLE_RUST: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/thdse:${{ github.workspace }}/thdse/src:${{ github.workspace }}/Cognitive-Core-Engine-Test

    steps:
      - name: Checkout latest accepted base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            thdse/requirements.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight experiment scripts
        run: |
          python -m py_compile scripts/closed_recursive_self_improvement_loop.py scripts/rsi_experiment_suite.py
          python -m pytest -q --import-mode=importlib --disable-warnings tests/test_closed_recursive_self_improvement_loop.py tests/test_rsi_experiment_suite.py

      - name: Run research experiment matrix
        run: |
          EXTRA_ARGS=()
          REPOSITORY_INPUT="${{ inputs.repository || 'all' }}"
          TASK_INPUT="${{ inputs.task || 'all' }}"
          VARIANT_INPUT="${{ inputs.variant || 'all' }}"
          if [ "$REPOSITORY_INPUT" != "all" ]; then
            EXTRA_ARGS+=(--repository "$REPOSITORY_INPUT")
          fi
          if [ "$TASK_INPUT" != "all" ]; then
            EXTRA_ARGS+=(--task "$TASK_INPUT")
          fi
          if [ "$VARIANT_INPUT" != "all" ]; then
            EXTRA_ARGS+=(--variant "$VARIANT_INPUT")
          fi
          python scripts/rsi_experiment_suite.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/reports/rsi_experiments/latest" \
            --max-generations "${{ inputs.max_generations || '4' }}" \
            --max-candidates "${{ inputs.max_candidates || '4' }}" \
            --wall-seconds "${{ inputs.wall_seconds || '1800' }}" \
            --timeout-seconds "${{ inputs.timeout_seconds || '420' }}" \
            --repeats "${{ inputs.repeats || '1' }}" \
            "${EXTRA_ARGS[@]}"

      - name: Show experiment summary
        if: always()
        run: |
          if [ -f reports/rsi_experiments/latest/summary.json ]; then
            cat reports/rsi_experiments/latest/summary.json
          else
            echo "No RSI experiment summary was produced."
          fi

      - name: Commit experiment reports
        run: |
          git status --short
          git add reports/rsi_experiments/latest
          if git diff --cached --quiet; then
            echo "No experiment report changes to commit."
          else
            git commit -m "Record RSI research experiment results"
            if ! git push; then
              echo "::warning::Experiment report push failed; uploaded artifacts remain available for manual recovery."
            fi
          fi

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-research-experiments
          path: reports/rsi_experiments/latest
          if-no-files-found: ignore
          retention-days: 30
