name: Closed RSI Loop

on:
  workflow_dispatch:
    inputs:
      max_generations:
        description: Maximum generations to attempt.
        required: true
        default: "20"
      max_candidates:
        description: Maximum candidates to evaluate per generation.
        required: true
        default: "20"
      wall_seconds:
        description: Cloud loop wall-clock budget in seconds.
        required: true
        default: "5400"
      timeout_seconds:
        description: Per-validation-command timeout in seconds.
        required: true
        default: "420"
      broad_gate:
        description: Run broad pytest gates after focused candidate tests.
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: closed-rsi-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closed-rsi-loop:
    name: Patch, verify, rollback, and promote candidates
    runs-on: ubuntu-latest
    timeout-minutes: 130

    env:
      OMEGA_THDSE_ENABLE_RUST: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/thdse:${{ github.workspace }}/thdse/src:${{ github.workspace }}/Cognitive-Core-Engine-Test

    steps:
      - name: Checkout latest accepted base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            thdse/requirements.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight loop entrypoint
        run: python -m py_compile scripts/closed_recursive_self_improvement_loop.py

      - name: Run closed recursive self-improvement loop
        shell: bash
        run: |
          set -euo pipefail
          args=(
            scripts/closed_recursive_self_improvement_loop.py
            --apply
            --state-dir .omega_rsi_runs
            --max-generations "${{ inputs.max_generations }}"
            --max-candidates "${{ inputs.max_candidates }}"
            --wall-seconds "${{ inputs.wall_seconds }}"
            --timeout-seconds "${{ inputs.timeout_seconds }}"
          )
          if [[ "${{ inputs.broad_gate }}" == "true" ]]; then
            args+=(--broad-gate)
          fi
          python "${args[@]}"

      - name: Show closed loop summary
        if: always()
        run: |
          if [ -f .omega_rsi_runs/closed_rsi_summary.json ]; then
            cat .omega_rsi_runs/closed_rsi_summary.json
          else
            echo "No closed RSI summary was produced."
          fi

      - name: Commit accepted state
        run: |
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No accepted candidate or state change to commit."
          else
            git commit -m "Promote closed RSI candidates"
            git push
          fi

      - name: Upload closed loop records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-rsi-records
          path: |
            .omega_rsi_runs/*.json
          if-no-files-found: ignore
          retention-days: 14
