name: RSI Omega Proof

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsi-omega-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omega-proof:
    name: Systemtest BSExpr grammar-growth proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile omega proof scripts
        run: python -m py_compile scripts/rsi_omega_systemtest.py scripts/rsi_omega.py scripts/rsi_omega_proof.py

      - name: Run Systemtest BSExpr cold/warm omega proof
        run: |
          python scripts/rsi_omega_proof.py \
            --budget 50 \
            --seeds 8 \
            --cold-seeds 12 \
            --require-confirmed \
            --json-output .omega_rsi_runs/rsi_omega_proof.json

      - name: Audit omega result schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(".omega_rsi_runs/rsi_omega_proof.json").read_text(encoding="utf-8"))
          for key in ("confirmed", "cold_solved", "warm_solved", "learned_operator_count", "warm_source", "output"):
              assert key in result, key
          assert isinstance(result["confirmed"], bool)
          assert result["confirmed"] is True
          assert result["cold_solved"] == 0
          assert result["learned_operator_count"] >= 1
          assert result["warm_solved"] is True
          print(
              json.dumps(
                  {
                      "confirmed": result["confirmed"],
                      "cold_solved": result["cold_solved"],
                      "warm_solved": result["warm_solved"],
                      "warm_source": result["warm_source"],
                      "learned_operator_count": result["learned_operator_count"],
                  },
                  sort_keys=True,
              )
          )
          PY
